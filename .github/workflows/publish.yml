name: Publish next candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-tools
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_READY == 'true'
    uses: ./.github/workflows/check.yml
  publish:
    needs: validate
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: candidates-ubuntu-latest
          path: artifacts
      - run: npm install --global npm@11.5.1
      - name: Publish the exact verified archives
        run: node scripts/publish.mjs
  verify-registry:
    needs: publish
    uses: ./.github/workflows/release-smoke.yml
