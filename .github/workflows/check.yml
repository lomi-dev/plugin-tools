name: Check tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - name: Report pending SDK integration
        if: vars.LOMI_SDK_REF == ''
        shell: bash
        run: echo 'Archive integration tests are pending. Set LOMI_SDK_REF to the full commit containing the candidate SDK in lomi-dev/lomi. Tool checks do not qualify SDK integration or desktop behavior.' >> "$GITHUB_STEP_SUMMARY"
  archives:
    needs: tools
    if: vars.LOMI_SDK_REF != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require a pinned SDK revision
        shell: bash
        env:
          SDK_REF: ${{ vars.LOMI_SDK_REF }}
        run: '[[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: plugin-tools
      - uses: actions/checkout@v4
        with:
          repository: lomi-dev/lomi
          ref: ${{ vars.LOMI_SDK_REF }}
          path: lomi
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
        working-directory: lomi
      - run: pnpm install --frozen-lockfile
        working-directory: plugin-tools
      - run: pnpm format:check
        working-directory: plugin-tools
      - run: pnpm check && pnpm test
        working-directory: plugin-tools
      - run: pnpm test:archives
        working-directory: plugin-tools
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.os }}
          path: plugin-tools/artifacts/
