name: Check tools
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  archives:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Read the pinned SDK source
        id: sdk
        shell: bash
        run: node scripts/sdk-ref.mjs >> "$GITHUB_OUTPUT"
        working-directory: plugin-tools
      - uses: actions/checkout@v4
        with:
          repository: lomi-dev/plugin-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: plugin-sdk
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
        working-directory: plugin-sdk
      - run: pnpm install --frozen-lockfile
        working-directory: plugin-tools
      - run: pnpm format:check
        working-directory: plugin-tools
      - run: pnpm check && pnpm test
        working-directory: plugin-tools
      - run: pnpm test:archives
        working-directory: plugin-tools
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.os }}
          path: plugin-tools/artifacts/
